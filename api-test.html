<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>UCPP V2 API Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f7fb;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }

    .job {
      border-bottom: 1px solid #ddd;
      padding: 12px 0;
    }

    .job:last-child {
      border-bottom: none;
    }

    button {
      padding: 10px 18px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>UCPP V2 API Test</h1>

  <div class="card">

    <h2>Backend Health</h2>

    <div id="health">
      Testing...
    </div>

  </div>


  <div class="card">

    <h2>Public Jobs</h2>

    <button id="loadJobs">
      Load Jobs
    </button>

    <div id="jobStatus"></div>

    <div id="jobs"></div>

  </div>


  <!-- IMPORTANT: config.js must load first -->

  <script src="js/config.js"></script>

  <script src="js/api.js"></script>


  <script>

    const healthBox =
      document.getElementById('health');

    const jobStatus =
      document.getElementById('jobStatus');

    const jobsBox =
      document.getElementById('jobs');


    /*
     * Test Backend Health
     */

    async function testHealth() {

      try {

        const result =
          await window.UCPP_API.health();

        healthBox.innerHTML =
          '<span class="success">' +
          '✓ Backend Connected — Version ' +
          result.data.version +
          '</span>';

      } catch (error) {

        healthBox.innerHTML =
          '<span class="error">' +
          '✕ Backend Connection Failed: ' +
          error.message +
          '</span>';

      }

    }


    /*
     * Load Public Jobs
     */

    async function loadJobs() {

      jobStatus.textContent =
        'Loading jobs...';

      jobsBox.innerHTML = '';

      try {

        const result =
          await window.UCPP_API.getJobs({
            page: 1,
            limit: 5
          });


        jobStatus.innerHTML =
          '<span class="success">' +
          '✓ API Success — ' +
          result.meta.totalRecords +
          ' valid jobs found' +
          '</span>';


        if (!result.data.length) {

          jobsBox.innerHTML =
            '<p>No jobs available.</p>';

          return;

        }


        result.data.forEach(job => {

          const item =
            document.createElement('div');

          item.className = 'job';


          const title =
            document.createElement('strong');

          title.textContent =
            job.Job_Title || 'Job';


          const company =
            document.createElement('div');

          company.textContent =
            job.Company_Name || '';


          const location =
            document.createElement('div');

          location.textContent =
            [
              job.City,
              job.State
            ]
            .filter(Boolean)
            .join(', ');


          item.appendChild(title);
          item.appendChild(company);
          item.appendChild(location);

          jobsBox.appendChild(item);

        });


      } catch (error) {

        jobStatus.innerHTML =
          '<span class="error">' +
          '✕ Jobs API Failed: ' +
          error.message +
          '</span>';

      }

    }


    document
      .getElementById('loadJobs')
      .addEventListener(
        'click',
        loadJobs
      );


    testHealth();

  </script>

</body>
</html>
